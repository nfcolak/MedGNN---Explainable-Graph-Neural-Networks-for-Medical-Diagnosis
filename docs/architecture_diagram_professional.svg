<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Project Architecture: Self-Explainable Graph Neural Networks for Medical Diagnosis</title>
  <desc id="desc">Professional layered architecture diagram for the medical diagnosis GNN project, covering data preparation, ProtGNN, GraphCare, baseline evaluation, and visualization artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f7f9fc; }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .section-label { font: 700 15px Inter, Arial, sans-serif; letter-spacing: 1.2px; fill: #475569; }
      .lane { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .lane-header { fill: #f1f5f9; stroke: #d8dee8; stroke-width: 1.5; }
      .lane-title { font: 700 18px Inter, Arial, sans-serif; fill: #1f2937; }
      .node { rx: 13; stroke-width: 2; filter: url(#shadow); }
      .node-title { font: 700 16px Inter, Arial, sans-serif; fill: #111827; }
      .node-body { font: 400 13.5px Inter, Arial, sans-serif; fill: #475569; }
      .muted { font: 400 12.5px Inter, Arial, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.6; marker-end: url(#arrow); }
      .arrow-light { fill: none; stroke: #64748b; stroke-width: 2.1; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .data { fill: #e8f1fb; stroke: #3b82b6; }
      .shared { fill: #edf7f6; stroke: #0f766e; }
      .model { fill: #f4eefc; stroke: #7c3aed; }
      .explain { fill: #fef6e7; stroke: #d97706; }
      .compare { fill: #eef6ff; stroke: #2563eb; }
      .artifact { fill: #eff7ed; stroke: #4d7c0f; }
      .viz { fill: #f7eff6; stroke: #a21caf; }
      .baseline { fill: #f9f1ec; stroke: #c2410c; }
      .badge { font: 700 11px Inter, Arial, sans-serif; fill: #334155; }
      .tag { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 10; }
      .tag-text { font: 700 11px Inter, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1120"/>

  <text x="90" y="76" class="title">Project Architecture</text>
  <text x="90" y="108" class="subtitle">Self-explainable graph neural networks for medical diagnosis with shared data, evaluation, comparison, and visualization layers</text>

  <text x="90" y="160" class="section-label">DATA FOUNDATION</text>
  <rect x="80" y="180" width="1640" height="175" class="lane"/>
  <rect x="80" y="180" width="1640" height="44" class="lane-header" rx="22"/>
  <text x="110" y="208" class="lane-title">Shared Cohort Construction</text>

  <rect x="120" y="255" width="270" height="68" class="node data"/>
  <text x="142" y="281" class="node-title">Raw MIMIC-IV-ED Tables</text>
  <text x="142" y="304" class="node-body">edstays, triage, diagnoses, meds, labs</text>

  <rect x="475" y="255" width="270" height="68" class="node data"/>
  <text x="497" y="281" class="node-title">Data Preparation</text>
  <text x="497" y="304" class="node-body">shared/data_prep/merge_ed.py</text>

  <rect x="830" y="255" width="270" height="68" class="node data"/>
  <text x="852" y="281" class="node-title">Merged ED Cohort</text>
  <text x="852" y="304" class="node-body">data/merged_ed.csv</text>

  <rect x="1185" y="255" width="270" height="68" class="node shared"/>
  <text x="1207" y="281" class="node-title">Evaluation Protocol</text>
  <text x="1207" y="304" class="node-body">subject-aware split, metrics, seed</text>

  <path class="arrow" d="M390 289 H465"/>
  <path class="arrow" d="M745 289 H820"/>
  <path class="arrow" d="M1100 289 H1175"/>

  <text x="90" y="405" class="section-label">MODEL AND EXPLANATION PIPELINES</text>
  <rect x="80" y="425" width="1040" height="455" class="lane"/>
  <rect x="80" y="425" width="1040" height="44" class="lane-header" rx="22"/>
  <text x="110" y="453" class="lane-title">Method A: ProtGNN Main Pipeline</text>

  <rect x="120" y="505" width="245" height="78" class="node shared"/>
  <text x="142" y="531" class="node-title">Dataset Configuration</text>
  <text x="142" y="554" class="node-body">protgnn_analysis/config.py</text>
  <text x="142" y="574" class="muted">target, graph variant, hyperparameters</text>

  <rect x="445" y="505" width="280" height="78" class="node data"/>
  <text x="467" y="531" class="node-title">Heterogeneous Graph Builder</text>
  <text x="467" y="554" class="node-body">IntraPatientHeteroDataset</text>
  <text x="467" y="574" class="muted">patient, vital, med, ICD, symptom, complaint</text>

  <rect x="805" y="505" width="275" height="78" class="node data"/>
  <text x="827" y="531" class="node-title">PyTorch Geometric Graphs</text>
  <text x="827" y="554" class="node-body">node features + edge_index</text>
  <text x="827" y="574" class="muted">patient-feature and med-med PMI edges</text>

  <rect x="120" y="642" width="245" height="78" class="node model"/>
  <text x="142" y="668" class="node-title">GNN Encoder</text>
  <text x="142" y="691" class="node-body">GnnNets: GCN / GAT / GIN</text>
  <text x="142" y="711" class="muted">message passing + graph readout</text>

  <rect x="445" y="642" width="280" height="78" class="node model"/>
  <text x="467" y="668" class="node-title">Prototype Classifier</text>
  <text x="467" y="691" class="node-body">prototype distances and activations</text>
  <text x="467" y="711" class="muted">cluster, separation, L1 losses</text>

  <rect x="805" y="642" width="275" height="78" class="node artifact"/>
  <text x="827" y="668" class="node-title">Prediction Outputs</text>
  <text x="827" y="691" class="node-body">disposition or disease class</text>
  <text x="827" y="711" class="muted">training metrics and test metrics</text>
  <rect x="827" y="730" width="150" height="22" class="tag"/>
  <text x="842" y="745" class="tag-text">shared protocol</text>

  <rect x="120" y="779" width="245" height="62" class="node explain"/>
  <text x="142" y="805" class="node-title">Prototype Projection</text>
  <text x="142" y="828" class="node-body">MCTS subgraph search</text>

  <rect x="445" y="779" width="280" height="62" class="node explain"/>
  <text x="467" y="805" class="node-title">GraphXAI Integration</text>
  <text x="467" y="828" class="node-body">Grad, IntegratedGrad, GNNExplainer</text>

  <rect x="805" y="779" width="275" height="62" class="node artifact"/>
  <text x="827" y="805" class="node-title">Explainability Artifacts</text>
  <text x="827" y="828" class="node-body">node importance + prototype evidence</text>

  <path class="arrow" d="M365 544 H435"/>
  <path class="arrow" d="M725 544 H795"/>
  <path class="arrow" d="M943 583 V612 H243 V632"/>
  <path class="arrow" d="M365 681 H435"/>
  <path class="arrow" d="M725 681 H795"/>
  <path class="arrow" d="M365 810 H435"/>
  <path class="arrow" d="M725 810 H795"/>
  <path class="arrow-dashed" d="M585 720 V769"/>
  <path class="arrow-dashed" d="M243 720 V769"/>

  <rect x="1170" y="425" width="550" height="455" class="lane"/>
  <rect x="1170" y="425" width="550" height="44" class="lane-header" rx="22"/>
  <text x="1200" y="453" class="lane-title">Comparison and Baseline Pipelines</text>

  <rect x="1210" y="505" width="215" height="72" class="node compare"/>
  <text x="1232" y="531" class="node-title">GraphCare KG</text>
  <text x="1232" y="554" class="node-body">ontology + PMI graph</text>

  <rect x="1470" y="505" width="210" height="72" class="node compare"/>
  <text x="1492" y="531" class="node-title">GraphCare Adapter</text>
  <text x="1492" y="554" class="node-body">cohort to model tensors</text>

  <rect x="1210" y="625" width="215" height="72" class="node compare"/>
  <text x="1232" y="651" class="node-title">BAT-GNN</text>
  <text x="1232" y="674" class="node-body">external GraphCare model</text>

  <rect x="1470" y="625" width="210" height="72" class="node artifact"/>
  <text x="1492" y="651" class="node-title">Comparison Report</text>
  <text x="1492" y="674" class="node-body">same split and metrics</text>
  <rect x="1492" y="711" width="150" height="22" class="tag"/>
  <text x="1507" y="726" class="tag-text">shared protocol</text>

  <rect x="1210" y="768" width="215" height="72" class="node baseline"/>
  <text x="1232" y="794" class="node-title">Tabular Baseline</text>
  <text x="1232" y="817" class="node-body">XGBoost / HistGB</text>

  <rect x="1470" y="768" width="210" height="72" class="node artifact"/>
  <text x="1492" y="794" class="node-title">Baseline Metrics</text>
  <text x="1492" y="817" class="node-body">reference performance</text>
  <rect x="1492" y="849" width="150" height="22" class="tag"/>
  <text x="1507" y="864" class="tag-text">shared protocol</text>

  <path class="arrow" d="M1425 541 H1460"/>
  <path class="arrow" d="M1575 577 V606 H1318 V615"/>
  <path class="arrow" d="M1425 661 H1460"/>
  <path class="arrow" d="M1425 804 H1460"/>

  <text x="90" y="930" class="section-label">ARTIFACT CONSUMPTION</text>
  <rect x="80" y="950" width="1640" height="120" class="lane"/>
  <rect x="80" y="950" width="1640" height="44" class="lane-header" rx="22"/>
  <text x="110" y="978" class="lane-title">Visualization and Deliverables</text>

  <rect x="210" y="1008" width="300" height="52" class="node viz"/>
  <text x="232" y="1030" class="node-title">Export ProtGNN Graphs</text>
  <text x="232" y="1049" class="node-body">visualizer/scripts/export_*.py</text>

  <rect x="625" y="1008" width="285" height="52" class="node viz"/>
  <text x="647" y="1030" class="node-title">Browser Graph Data</text>
  <text x="647" y="1049" class="node-body">JSON shards + manifest</text>

  <rect x="1025" y="1008" width="260" height="52" class="node viz"/>
  <text x="1047" y="1030" class="node-title">React Visualizer</text>
  <text x="1047" y="1049" class="node-body">GraphCanvas + details panel</text>

  <rect x="1410" y="1008" width="220" height="52" class="node artifact"/>
  <text x="1432" y="1030" class="node-title">Research Deliverables</text>
  <text x="1432" y="1049" class="node-body">reports, figures, thesis assets</text>

  <path class="arrow" d="M510 1034 H615"/>
  <path class="arrow" d="M910 1034 H1015"/>
  <path class="arrow" d="M1285 1034 H1400"/>

  <path class="arrow-light" d="M965 323 V370 H943 V495"/>
  <path class="arrow-light" d="M943 841 V906 H64 V1034 H200"/>
  <path class="arrow-light" d="M975 841 V918 H1155 V998"/>

  <text x="830" y="860" class="badge">explanations</text>
  <text x="1465" y="860" class="badge">metrics</text>
</svg>
