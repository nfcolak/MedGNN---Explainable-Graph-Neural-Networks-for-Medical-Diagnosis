<text x="460" y="528" font-size="16" text-anchor="middle" fill="#111111" font-weight="400">instance_of</text><rect x="40" y="605" width="26" height="18" rx="4" fill="#DCE6F2" stroke="#16324F" stroke-width="2"/><text x="74" y="620" font-size="16" fill="#111111">Patient / visit</text><rect x="239" y="605" width="26" height="18" rx="4" fill="#FCE8CF" stroke="#9A5B13" stroke-width="2"/><text x="273" y="620" font-size="16" fill="#111111">Complaint</text><rect x="384" y="605" width="26" height="18" rx="4" fill="#E1F2DE" stroke="#3C7A33" stroke-width="2"/><text x="418" y="620" font-size="16" fill="#111111">Vital sign (numeric)</text><rect x="628" y="605" width="26" height="18" rx="4" fill="#D2EEF0" stroke="#0B7A75" stroke-width="2"/><text x="662" y="620" font-size="16" fill="#111111">Lab result / analyte (numeric)</text><rect x="962" y="605" width="26" height="18" rx="4" fill="#EBDDF1" stroke="#6B3A80" stroke-width="2"/><text x="996" y="620" font-size="16" fill="#111111">Prior diagnosis (optional)</text><text x="40" y="655" font-size="14.5" fill="#555555">Arrow directions follow the graph builder (graph.py). has_visit / index_visit_of and has_prior_diagnosis / recurrence_of have inverse pairs;</text><text x="40" y="677" font-size="14.5" fill="#555555">co_complaint and comorbid_with are symmetric. Forward view in the core study; typed reverse edges (rev:*) are an optional mode, not used for reported results.</text><text x="40" y="699" font-size="14.5" fill="#555555">Prior visits contribute through visit membership of their results and diagnoses. The index visit's own diagnosis is the target, never a graph input.</text><text x="40" y="721" font-size="14.5" fill="#555555">Dashed = optional. Teal = numeric payload spanning two endpoints: trajectory_of chains prior results; baseline_of links the last prior result to the index result.</text><text x="1240" y="742" font-size="18" font-weight="700" text-anchor="end" fill="#111111">Schematic — not patient data</text></svg>