<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Self-Explainable GNN Medical Diagnosis Project Architecture</title>
  <desc id="desc">Colorful architecture diagram showing shared MIMIC-IV-ED data preparation, ProtGNN, GraphCare, baseline, and visualizer flows.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Inter, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 800 22px Inter, Arial, sans-serif; fill: #111827; }
      .box-title { font: 800 17px Inter, Arial, sans-serif; fill: #111827; }
      .box-text { font: 500 14px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #475569; }
      .panel { rx: 24; filter: url(#shadow); }
      .box { rx: 15; stroke-width: 2.3; filter: url(#shadow); }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .data { fill: #dbeafe; stroke: #2563eb; }
      .shared { fill: #e0f2fe; stroke: #0284c7; }
      .prot-data { fill: #fef3c7; stroke: #d97706; }
      .prot-model { fill: #fce7f3; stroke: #db2777; }
      .explain { fill: #ede9fe; stroke: #7c3aed; }
      .output { fill: #dcfce7; stroke: #16a34a; }
      .graphcare { fill: #ccfbf1; stroke: #0d9488; }
      .baseline { fill: #ffedd5; stroke: #ea580c; }
      .visual { fill: #fae8ff; stroke: #c026d3; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text x="72" y="70" class="title">Self-Explainable GNN Medical Diagnosis Architecture</text>
  <text x="72" y="102" class="subtitle">Shared MIMIC-IV-ED cohort feeding ProtGNN, GraphCare, tabular baselines, and an interactive graph visualizer</text>

  <rect x="56" y="142" width="1488" height="160" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="82" y="178" class="panel-title">Shared Data and Evaluation Spine</text>

  <rect x="88" y="206" width="270" height="70" class="box data"/>
  <text x="110" y="234" class="box-title">MIMIC-IV-ED raw files</text>
  <text x="110" y="258" class="box-text">edstays, triage, diagnosis</text>

  <rect x="430" y="206" width="270" height="70" class="box data"/>
  <text x="452" y="234" class="box-title">shared/data_prep</text>
  <text x="452" y="258" class="box-text">merge_ed.py + standardizers</text>

  <rect x="772" y="206" width="270" height="70" class="box data"/>
  <text x="794" y="234" class="box-title">data/merged_ed.csv</text>
  <text x="794" y="258" class="box-text">shared patient cohort</text>

  <rect x="1114" y="206" width="270" height="70" class="box shared"/>
  <text x="1136" y="234" class="box-title">shared/lib</text>
  <text x="1136" y="258" class="box-text">subject-aware split + metrics</text>

  <path class="arrow" d="M358 241 H420"/>
  <path class="arrow" d="M700 241 H762"/>
  <path class="arrow" d="M1042 241 H1104"/>

  <rect x="56" y="344" width="914" height="500" rx="28" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
  <text x="82" y="382" class="panel-title">Method A: ProtGNN Analysis</text>

  <rect x="94" y="420" width="220" height="76" class="box prot-data"/>
  <text x="116" y="449" class="box-title">Config</text>
  <text x="116" y="473" class="box-text">dataset, model, train settings</text>

  <rect x="374" y="420" width="250" height="76" class="box prot-data"/>
  <text x="396" y="449" class="box-title">IntraPatientHeteroDataset</text>
  <text x="396" y="473" class="box-text">one graph per ED visit</text>

  <rect x="684" y="420" width="248" height="76" class="box prot-data"/>
  <text x="706" y="449" class="box-title">Patient Graph</text>
  <text x="706" y="473" class="box-text">patient, vital, med, symptom</text>

  <rect x="94" y="548" width="220" height="76" class="box prot-model"/>
  <text x="116" y="577" class="box-title">GNN Backbone</text>
  <text x="116" y="601" class="box-text">GCN / GAT / GIN</text>

  <rect x="374" y="548" width="250" height="76" class="box prot-model"/>
  <text x="396" y="577" class="box-title">Graph Embedding</text>
  <text x="396" y="601" class="box-text">node embeddings + readout</text>

  <rect x="684" y="548" width="248" height="76" class="box prot-model"/>
  <text x="706" y="577" class="box-title">Prototype Layer</text>
  <text x="706" y="601" class="box-text">distance, activation, class score</text>

  <rect x="94" y="676" width="220" height="76" class="box explain"/>
  <text x="116" y="705" class="box-title">MCTS Projection</text>
  <text x="116" y="729" class="box-text">prototype-like subgraphs</text>

  <rect x="374" y="676" width="250" height="76" class="box explain"/>
  <text x="396" y="705" class="box-title">GraphXAI Explainers</text>
  <text x="396" y="729" class="box-text">Grad, IntegratedGrad, GNNExplainer</text>

  <rect x="684" y="676" width="248" height="76" class="box output"/>
  <text x="706" y="705" class="box-title">Outputs</text>
  <text x="706" y="729" class="box-text">metrics, checkpoints, explanations</text>

  <path class="arrow" d="M314 458 H364"/>
  <path class="arrow" d="M624 458 H674"/>
  <path class="arrow" d="M808 496 V538"/>
  <path class="arrow" d="M684 586 H634"/>
  <path class="arrow" d="M374 586 H324"/>
  <path class="arrow" d="M204 624 V666"/>
  <path class="arrow" d="M314 714 H364"/>
  <path class="arrow" d="M624 714 H674"/>
  <path class="soft-arrow" d="M808 624 V666"/>

  <rect x="1016" y="344" width="528" height="252" rx="28" fill="#ecfeff" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="1042" y="382" class="panel-title">Method B: GraphCare Comparison</text>

  <rect x="1050" y="420" width="200" height="68" class="box graphcare"/>
  <text x="1070" y="447" class="box-title">Global KG</text>
  <text x="1070" y="470" class="box-text">ontology + PMI</text>

  <rect x="1306" y="420" width="200" height="68" class="box graphcare"/>
  <text x="1326" y="447" class="box-title">Adapter</text>
  <text x="1326" y="470" class="box-text">GraphCare tensors</text>

  <rect x="1050" y="512" width="200" height="68" class="box graphcare"/>
  <text x="1070" y="539" class="box-title">BAT-GNN</text>
  <text x="1070" y="562" class="box-text">external/GraphCare</text>

  <rect x="1306" y="512" width="200" height="68" class="box output"/>
  <text x="1326" y="539" class="box-title">Report</text>
  <text x="1326" y="562" class="box-text">shared metrics</text>

  <path class="arrow" d="M1250 454 H1296"/>
  <path class="arrow" d="M1406 488 V502"/>
  <path class="arrow" d="M1306 546 H1260"/>

  <rect x="1016" y="628" width="528" height="216" rx="28" fill="#fdf4ff" stroke="#d946ef" stroke-width="2.5"/>
  <text x="1042" y="666" class="panel-title">Interactive Graph Visualizer</text>

  <rect x="1050" y="704" width="200" height="68" class="box visual"/>
  <text x="1070" y="731" class="box-title">Export Script</text>
  <text x="1070" y="754" class="box-text">PyG graphs to JSON</text>

  <rect x="1306" y="704" width="200" height="68" class="box visual"/>
  <text x="1326" y="731" class="box-title">React UI</text>
  <text x="1326" y="754" class="box-text">GraphCanvas + details</text>

  <path class="arrow" d="M1250 738 H1296"/>

  <rect x="56" y="880" width="1488" height="60" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <rect x="88" y="894" width="260" height="34" rx="14" class="baseline"/>
  <text x="108" y="916" class="small">Tabular baseline: XGBoost / HistGradientBoosting</text>
  <text x="386" y="916" class="small">All branches use the same cohort, comparable split logic, and shared metrics where applicable.</text>

  <path class="soft-arrow" d="M907 276 V410"/>
  <path class="soft-arrow" d="M1249 276 V410"/>
  <path class="soft-arrow" d="M907 276 C990 314 1080 330 1150 410"/>
  <path class="soft-arrow" d="M907 276 C1030 520 1120 615 1150 694"/>
  <path class="soft-arrow" d="M907 276 C780 832 520 888 348 910"/>
</svg>
